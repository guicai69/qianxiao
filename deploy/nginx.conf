# 羽毛球馆预约管理系统 Nginx 配置（与 docs/deploy.md 配套）
# 放到 /etc/nginx/sites-available/badminton 后 ln -s 到 sites-enabled
server {
    listen 80;
    server_name _;                       # 生产改成你的域名
    client_max_body_size 10m;

    # 后端 API
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Django 静态文件（collectstatic 之后）
    location /static/ {
        alias /opt/badminton/backend/staticfiles/;
    }

    # 前端构建产物
    location / {
        root /opt/badminton/frontend/dist;
        try_files $uri $uri/ /index.html;   # SPA history 路由回退
    }
}
