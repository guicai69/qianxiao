components:
  schemas:
    Activity:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        venue:
          type: integer
          title: 场馆
        venue_name:
          type: string
          readOnly: true
        type:
          allOf:
          - $ref: '#/components/schemas/ActivityTypeEnum'
          title: 类型
        title:
          type: string
          title: 标题
          maxLength: 100
        description:
          type: string
          title: 说明
        start_at:
          type: string
          format: date-time
          title: 开始时间
        end_at:
          type: string
          format: date-time
          title: 结束时间
        price:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,2})?$
          title: 价格
        capacity:
          type: integer
          maximum: 4294967295
          minimum: 0
          format: int64
          title: 名额
        registered:
          type: integer
          maximum: 4294967295
          minimum: 0
          format: int64
          title: 已报名
        deadline:
          type: string
          format: date-time
          title: 报名截止
        is_active:
          type: boolean
          title: 启用
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: 创建时间
      required:
      - capacity
      - created_at
      - deadline
      - end_at
      - id
      - start_at
      - title
      - venue
      - venue_name
    ActivityTypeEnum:
      enum:
      - match
      - training
      - coach
      type: string
      description: |-
        * `match` - 比赛
        * `training` - 培训
        * `coach` - 教练课
    AdminUserCreate:
      type: object
      description: 管理员创建用户（可指定角色）
      properties:
        phone:
          type: string
          title: 手机号
          maxLength: 11
        password:
          type: string
          writeOnly: true
          title: 密码
          minLength: 6
        nickname:
          type: string
          title: 昵称
          maxLength: 50
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          title: 角色
        level:
          allOf:
          - $ref: '#/components/schemas/LevelEnum'
          title: 会员等级
      required:
      - password
      - phone
    AdminUserUpdate:
      type: object
      description: 管理员修改用户（角色/等级/状态）
      properties:
        nickname:
          type: string
          title: 昵称
          maxLength: 50
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          title: 角色
        level:
          allOf:
          - $ref: '#/components/schemas/LevelEnum'
          title: 会员等级
        is_active:
          type: boolean
          title: 有效
          description: 指明用户是否被认为是活跃的。以反选代替删除帐号。
        is_blacklisted:
          type: boolean
          title: 拉黑
    Announcement:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        title:
          type: string
          title: 标题
          maxLength: 100
        content:
          type: string
          title: 内容
        is_published:
          type: boolean
          title: 发布
        is_pinned:
          type: boolean
          title: 置顶
        created_at:
          type: string
          format: date-time
          readOnly: true
          title: 创建时间
        updated_at:
          type: string
          format: date-time
          readOnly: true
          title: 更新时间
      required:
      - content
      - created_at
      - id
      - title
      - updated_at
    BookingCreate:
      type: object
      properties:
        court:
          type: integer
          title: 场地
        date:
          type: string
          format: date
          title: 日期
        time_slot:
          type: integer
          title: 时段
        user_coupon_id:
          type: integer
          writeOnly: true
      required:
      - court
